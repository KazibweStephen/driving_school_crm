map $http_user_agent $is_mobile_ua {
    default 0;
    "~*(android|iphone|ipad|ipod|iemobile|blackberry|webos|windows phone|mobile|silk|playbook|opera mini)" 1;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 500M;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        if ($is_mobile_ua = 1) {
            set $mobile_redirect 1;
        }
        if ($cookie_prefer_desktop = 1) {
            set $mobile_redirect 0;
        }
        if ($mobile_redirect = 1) {
            return 301 /m/;
        }
        try_files $uri $uri/ /index.html;
    }

    location = /login {
        if ($is_mobile_ua = 1) {
            set $mobile_redirect 1;
        }
        if ($cookie_prefer_desktop = 1) {
            set $mobile_redirect 0;
        }
        if ($mobile_redirect = 1) {
            return 301 /m/login;
        }
        try_files $uri $uri/ /index.html;
    }

    location ^~ /m/ {
        alias /usr/share/nginx/html/mobile/;
        try_files $uri $uri/ /m/index.html;
    }

    location = /m {
        return 301 /m/;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
    }
}
