<app-page-header title="Send SMS" />

<div class="space-y-4">
  <div class="rounded-xl border border-slate-200 bg-white p-4">
    <label class="mb-1 block text-sm font-medium text-slate-700">Recipient</label>
    @if (!phone()) {
      <app-client-search (selected)="onClientSelected($event)" />
    } @else {
      <div class="flex items-center justify-between rounded-lg border border-slate-200 bg-slate-50 px-3 py-2">
        <div>
          <div class="text-sm font-medium text-slate-800">
            {{ client?.first_name }} {{ client?.middle_name }} {{ client?.last_name }}
          </div>
          <div class="text-xs text-slate-500">{{ phone() }}</div>
        </div>
        <button pButton type="button" label="Change" text (click)="clearRecipient()"></button>
      </div>
    }
  </div>

  @if (!phone()) {
    <div class="rounded-xl border border-slate-200 bg-white p-4">
      <label class="mb-1 block text-sm font-medium text-slate-700">Or enter phone directly</label>
      <input
        pInputText
        type="tel"
        class="w-full"
        [ngModel]="manualPhone"
        (ngModelChange)="onManualPhone($event)"
        placeholder="0700 000 000"
        data-testid="sms-phone"
      />
    </div>
  }

  <div class="space-y-3 rounded-xl border border-slate-200 bg-white p-4">
    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700">Use a saved template</label>
      <p-select
        [options]="templates()"
        optionLabel="name"
        optionValue="id"
        [(ngModel)]="templateId"
        (ngModelChange)="onTemplateChange()"
        appendTo="body"
        class="w-full"
        placeholder="Choose template…"
        (click)="loadTemplates()"
        data-testid="template-select"
      />
    </div>
    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700">Message</label>
      <textarea
        pTextarea
        rows="4"
        class="w-full"
        [ngModel]="message()"
        (ngModelChange)="message.set($event)"
        placeholder="Type your message…"
        data-testid="sms-body"
      ></textarea>
      <div class="mt-1 flex justify-between text-xs text-slate-500">
        <span>{{ message().length }} characters</span>
        <span>{{ segmentCount() }} SMS</span>
      </div>
    </div>
  </div>

  <p-button
    label="Send SMS"
    styleClass="w-full justify-center"
    [loading]="sending()"
    [disabled]="!phone() || !message().trim()"
    (click)="send()"
    data-testid="send-sms"
  />
</div>

<app-loading-overlay [visible]="loadingTemplates()" message="Loading templates..." />
<app-loading-overlay [visible]="sending()" message="Sending SMS..." />
